<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="./assets/vendor/sortablejs/Sortable.min.js"></script>
</head>
<body class="p-5 bg-slate-900 text-white">
    <div class="max-w-4xl mx-auto">
        <div class="flex justify-center mb-6">
            <h1 class="text-3xl font-bold tracking-tight">Tierlist Maker</h1>
        </div>

        <div id="tierlist" class="flex flex-col border border-slate-700 bg-slate-800">
            
            <div class="flex min-h-[80px] border-b border-slate-700">
                <div class="w-24 flex items-center justify-center bg-red-500 text-slate-900 font-bold border-r border-slate-700">
                    S
                </div>
                <div id="s-tier" class="flex-1 p-2 flex flex-wrap gap-2">
                    </div>
            </div>

            <div class="flex min-h-[80px] border-b border-slate-700">
                <div class="w-24 flex items-center justify-center bg-orange-400 text-slate-900 font-bold border-r border-slate-700">
                    A
                </div>
                <div id="a-tier" class="flex-1 p-2 flex flex-wrap gap-2">
                </div>
            </div>

            <div class="flex min-h-[80px] border-b border-slate-700">
                <div class="w-24 flex items-center justify-center bg-yellow-400 text-slate-900 font-bold border-r border-slate-700">
                    B
                </div>
                <div id="b-tier" class="flex-1 p-2 flex flex-wrap gap-2">
                </div>
            </div>

            <div class="flex min-h-[80px] border-b border-slate-700">
                <div class="w-24 flex items-center justify-center bg-lime-400 text-slate-900 font-bold border-r border-slate-700">
                    C
                </div>
                <div id="c-tier" class="flex-1 p-2 flex flex-wrap gap-2">
                </div>
            </div>

            <div class="flex min-h-[80px] border-b border-slate-700">
                <div class="w-24 flex items-center justify-center bg-blue-400 text-slate-900 font-bold border-r border-slate-700">
                    D
                </div>
                <div id="d-tier" class="flex-1 p-2 flex flex-wrap gap-2">
                </div>
            </div>

            <div class="flex min-h-[80px] border-b border-slate-700">
                <div id="add-rank" class="w-24 flex items-center justify-center text-slate-900 text-white font-bold border-r border-slate-700">
                    +
                </div>
                <div class="flex-1 p-2 flex flex-wrap gap-2">
                </div>
            </div>

        </div>
        <div class="mt-10 p-4 border-2 border-dashed border-slate-700 rounded-lg">
            <p class="text-sm text-slate-400 mb-3">Unranked Items</p>
            <div id="item-bank" class="flex flex-wrap gap-2">
            </div>
        </div>
    </div>
</body>
